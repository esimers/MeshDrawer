[package]
name = "meshdrawer"
version = "0.1.0"
description = "Local 3D print file library"
authors = ["MeshDrawer contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "meshdrawer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
dunce = "1"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.6"
zip = "2"
quick-xml = "0.37"
trash = "5"
sha2 = "0.10"
ufbx = "0.11"
truck-stepio = "0.3"
truck-meshalgo = "0.4"
truck-polymesh = "0.6"
truck-topology = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
